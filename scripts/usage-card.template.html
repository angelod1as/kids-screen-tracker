<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uso de __KID__</title>
<!-- #131. D42 palette only; the pairs and ratios are in docs/design.md. -->
<style>
  :root {
    --ink: #000;
    --paper: #fff;
    --floor: #f1f5f9;
    --accent: #193cb8;
    --alert: #c10007;
    --line: #000;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #fff;
      --paper: #000;
      --floor: #000;
      --line: #fff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--floor);
    color: var(--ink);
    font: 400 16px/1.4 "IBM Plex Sans", system-ui, sans-serif;
  }
  main {
    max-width: 28rem;
    margin: 0 auto;
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .band {
    background: var(--accent);
    color: #fff;
    padding: 12px 16px;
  }
  .band h1 {
    margin: 0;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  .band p { margin: 4px 0 0; font-size: 0.75rem; font-weight: 700; }
  .num, .row b {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }
  .hero { padding: 16px; text-align: center; border-bottom: 2px solid var(--line); }
  .hero .num {
    display: inline-block;
    font-size: 3.75rem;
    line-height: 1;
    padding: 8px 16px;
    border-radius: 8px;
  }
  .hero .num.over { background: var(--alert); color: #fff; }
  .hero .num.ok { background: var(--accent); color: #fff; }
  .hero p { margin: 8px 0 0; font-weight: 700; }
  .app { padding: 12px 16px; border-bottom: 2px solid var(--line); }
  .app header { display: flex; justify-content: space-between; align-items: center; }
  .app h2 {
    margin: 0;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  .badge {
    padding: 2px 8px;
    border-radius: 4px;
    color: #fff;
    font-weight: 700;
    font-size: 0.875rem;
  }
  .badge.ok { background: var(--accent); }
  .badge.over { background: var(--alert); }
  .row {
    display: grid;
    grid-template-columns: 5.5rem 1fr 4.5rem;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
    font-size: 0.875rem;
  }
  .row b { text-align: right; }
  .track {
    height: 16px;
    border: 2px solid var(--line);
    border-radius: 4px;
    background: var(--paper);
    overflow: hidden;
  }
  .bar { height: 100%; }
  .bar.allowed { background: #f1f5f9; border-right: 2px solid var(--line); }
  .bar.used.ok { background: var(--accent); }
  .bar.used.over { background: var(--alert); }
  .note { margin: 8px 0 0; font-weight: 700; font-size: 0.875rem; }
  .conclusion { padding: 16px; margin: 0; font-weight: 700; border-bottom: 2px solid var(--line); }
  .footer { padding: 12px 16px; font-size: 0.75rem; }
  .footer p { margin: 0 0 4px; }
  @media print {
    body { background: #fff; padding: 0; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<main>
  <div class="band">
    <h1>__KID__</h1>
    <p>__WINDOW__ · __DEVICE__</p>
    <p>WhatsApp: 1h por dia grátis</p>
  </div>
  <div class="hero">
    <span class="num __HERO_CLASS__">__HERO__</span>
    <p>passou do combinado</p>
  </div>
__APPS__
  <p class="conclusion">__CONCLUSION__</p>
  <footer class="footer">
    <p><b>Permitido:</b> o que ele pediu no app, mais 1h/dia de WhatsApp.</p>
    <p><b>Usou:</b> o tempo medido pelo Family Link.</p>
  </footer>
</main>
</body>
</html>
